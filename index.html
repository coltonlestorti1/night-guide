<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENDZ Nightlife Map</title>
    <meta name="description" content="Discover tonight's hot spots near you — ENDZ Nightlife Map." />
    <meta name="author" content="ENDZ" />
    <link rel="canonical" href="/" />

    <!-- Favicon (ENDZ "E" mark) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- PWA / installability -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Must match the manifest's background_color and the splash. The app is
         light-only — src/index.css has no .dark block — so the old #09090b here
         was a leftover from a dark theme that no longer exists, and it made the
         OS-level launch colour flash dark before the off-white splash. -->
    <meta name="theme-color" content="#F7F7F4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = dark text on light, correct for a light app. Was "black",
         which paints a solid black bar above an off-white screen. NOT
         "black-translucent": that makes the web view full-screen and every
         layout in the app would need safe-area padding it does not have. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ENDZ" />

    <!-- Launch screens. Tapped from the home screen, iOS paints white from the
         tap until the HTML document arrives — ~2s cold. These are the only
         thing allowed to draw in that window, and iOS needs a pixel-exact
         match: one wrong dimension and it silently falls back to white.
         Generated by `npm run make:splash`; frame 0 of the splash below. -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-640x1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1260x2736.png" />

    <meta property="og:title" content="ENDZ — East Village Nightlife" />
    <meta property="og:description" content="The live map for where the night's actually happening. Launching soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://night-guide.vercel.app/" />
    <meta property="og:image" content="https://night-guide.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ENDZ — East Village Nightlife" />
    <meta name="twitter:description" content="The live map for where the night's actually happening. Launching soon." />
    <meta name="twitter:image" content="https://night-guide.vercel.app/og-image.png" />
  </head>

  <body>
    <!-- Static splash, painted from HTML before any JavaScript runs.
         #root is empty until React mounts AND the two web fonts resolve, which
         on a cold 5G load left a blank WHITE screen for seconds — Colton caught
         it on video 2026-08-08. The Suspense fallback inside App.tsx cannot
         help: it only exists once React is already running.

         Background is the app's own --background (#F7F7F4), so there is no
         colour flash when the real UI takes over. Removed by src/main.tsx after
         the first render.

         On a home-screen launch this is the SECOND thing you see: iOS paints
         one of the /splash/*.png startup images first, and this markup is drawn
         to be identical to it apart from the orbiting dot. Keep it that way —
         `node scripts/make-splash-image.mjs --check` fails if it drifts. -->
    <div id="endz-splash" aria-hidden="true">
      <!-- One inline SVG: no font load, no image request, nothing to wait for.
           Geometry is mirrored from scripts/lib/splash-art.mjs, which also
           renders the startup PNGs; `node scripts/make-splash-image.mjs --check`
           fails the build if these two drift apart. -->
      <!-- 103 = 2 x (ringRadius 46 + dotRadius 5.5). The box is the ring PLUS
           the dot's radius on every side: the dot rides on the ring, so a box
           sized to the ring alone clips it in half at 12 o'clock — the exact
           frame the startup PNG shows. -->
      <svg class="endz-splash-mark" width="103" height="103" viewBox="0 0 103 103"
           fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sampled from the app icon: purple to pink on the anti-diagonal.
               Default objectBoundingBox units, so it spans the E's own box. -->
          <linearGradient id="endz-splash-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8C51ED" />
            <stop offset="0.5" stop-color="#BC56B9" />
            <stop offset="1" stop-color="#F97087" />
          </linearGradient>
        </defs>
        <!-- The orbit track: still, always. -->
        <circle cx="51.5" cy="51.5" r="46" fill="none" stroke="#6C45FF"
                stroke-opacity="0.18" stroke-width="1.5" />
        <!-- The E, as four axis-aligned bars — the same proportions as
             public/icon-512.png (86/88/326/304/510 of a 1024 canvas).
             ONE path, not four <rect>s, and that matters: objectBoundingBox
             gradient units resolve against each individual shape's box, so
             four rects gave each bar its own full purple-to-pink sweep instead
             of one sweep across the letter. As a single path the box is the
             whole E, which is what the PNG renderer draws. -->
        <path fill="url(#endz-splash-grad)"
              d="M36.8 28.5H66.2V36.26H36.8ZM36.8 47.62H64.22V55.38H36.8ZM36.8 66.74H66.2V74.5H36.8ZM36.8 28.5H44.74V74.5H36.8Z" />
        <!-- The only thing that moves. Drawn at 12 o'clock, which is exactly
             what the static startup PNG shows, so the handoff is invisible. -->
        <g class="endz-splash-orbit">
          <circle cx="51.5" cy="5.5" r="5.5" fill="#6C45FF" />
        </g>
      </svg>
      <svg class="endz-splash-word" width="68" height="14.1"
           viewBox="0 0 1000 207.35" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="ENDZ">
        <!-- Space Grotesk Bold outlines, extracted once. The markup this
             replaces asked for the "Space Grotesk Variable" webfont, which is
             imported in src/main.tsx and has NOT loaded when the splash paints
             — so the wordmark silently rendered in system sans until now. -->
        <path fill="#707070" d="M0 207.35L0 0L133.29 0L133.29 35.55L39.1 35.55L39.1 85.01L125 85.01L125 120.56L39.1 120.56L39.1 171.8L135.07 171.8L135.07 207.35ZM264.81 207.35L264.81 0L339.16 0L380.33 180.69L385.66 180.69L385.66 0L424.17 0L424.17 207.35L349.82 207.35L308.65 26.66L303.32 26.66L303.32 207.35ZM558.06 207.35L558.06 172.99L585.31 172.99L585.31 34.36L558.06 34.36L558.06 0L643.36 0Q685.13 0 706.9 21.18Q728.67 42.36 728.67 84.12L728.67 123.22Q728.67 164.99 706.9 186.17Q685.13 207.35 643.36 207.35ZM624.41 171.8L643.96 171.8Q667.65 171.8 678.61 159.36Q689.57 146.92 689.57 124.41L689.57 82.94Q689.57 60.13 678.61 47.84Q667.65 35.55 643.96 35.55L624.41 35.55ZM856.04 207.35L856.04 157.58L958.53 39.69L958.53 34.95L859 34.95L859 0L999.41 0L999.41 49.76L896.92 167.65L896.92 172.39L1000 172.39L1000 207.35Z" />
      </svg>
    </div>
    <style>
      /* justify-content: center puts the group at exactly 50% — see the
         centerYFraction note in scripts/lib/splash-art.mjs. It has to stay
         50%, or the mark jumps when iOS hands off from the startup image. */
      #endz-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px;
        background: #F7F7F4;
        transition: opacity 220ms ease;
      }
      #endz-splash.endz-splash-out { opacity: 0; pointer-events: none; }
      .endz-splash-mark { display: block; }
      .endz-splash-word { display: block; }
      /* The ONLY moving part. The dot is drawn at 12 o'clock and rotated about
         the SVG's origin, so frame 0 is identical to the static startup PNG.
         Linear, so there is no eased pause that could read as a stall. */
      /* transform-box and transform-origin are BOTH stated explicitly. Their
         defaults for SVG have changed across engines, and getting the origin
         wrong sends the dot around a circle that is not the ring — on iOS
         Safari, which is the one browser we cannot check from here. */
      .endz-splash-orbit {
        transform-box: view-box;
        transform-origin: 51.5px 51.5px;
        animation: endz-splash-orbit 1400ms linear infinite;
      }
      @keyframes endz-splash-orbit {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Parks at 12 o'clock — which is the startup PNG exactly. */
        .endz-splash-orbit { animation: none; }
        #endz-splash { transition: none; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
